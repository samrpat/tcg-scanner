# A read-only window onto the card photographs, and nothing else.
#
# eBay's servers fetch listing pictures themselves, so a bulk upload can only carry photos if
# the URLs in it are reachable from the internet. The obvious move — tunnelling the whole app —
# is wrong: this application has no authentication, so anyone who found the address could read
# and destroy the collection. What eBay actually needs is a few JPEGs, which are about to be
# public on a listing anyway.
#
# So this serves exactly that: GET on files under /api/images, nothing else, no listing, no
# write method, no proxy to the API. Run it only while an upload is in flight.

server {
    listen 80;
    server_name _;

    # Do not advertise the version to the internet.
    server_tokens off;

    # No frames, no sniffing, no referrer leakage.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Anything that is not a GET or HEAD of a card image is refused before it touches disk.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Only image files, only under the images root, and no directory listings — a leaked URL
    # exposes one card's photograph, not an index of the whole collection.
    location ~ "^/api/images/(CARD-[0-9]{6})/([a-z0-9-]+\.jpg)$" {
        alias /data/images/$1/$2;
        autoindex off;
        # The filenames are stable and the app cache-busts with ?v=, so let eBay and any CDN
        # in front of this hold on to them.
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log /var/log/nginx/photos.log;
    }

    location / {
        return 404;
    }
}
