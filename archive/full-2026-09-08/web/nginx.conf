# Shared by the HTTP and HTTPS servers.
map $host $tcg_placeholder { default ""; }

server {
    listen 80;
    # Also listen on IPv6: inside the container `localhost` resolves to ::1 first, so an
    # IPv4-only listener makes every healthcheck against localhost fail with ECONNREFUSED.
    listen [::]:80;
    server_name _;
    include /etc/nginx/tcg-app.conf;
}
