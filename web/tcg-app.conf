root /usr/share/nginx/html;
index index.html;

# A 48MP phone photo at maximum quality.
client_max_body_size 64m;

# Compress the things that compress. The JS bundle and the batch's JSON are text and shrink
# by roughly three quarters; over a Pi's wifi that is the difference between the grid
# appearing and the grid loading. JPEGs are deliberately absent — they are already compressed,
# and gzipping them spends CPU to make them very slightly larger.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/javascript text/css application/json image/svg+xml text/plain;

# ── Security headers ───────────────────────────────────────────────────────────────────
#
# `always` on every one of them: without it nginx omits the header on error responses, which
# are exactly the pages most likely to reflect something back at you.

# A strict Content-Security-Policy is affordable here because everything is served from this
# origin — the fonts are self-hosted, there is no analytics, no CDN, no third party at all.
#
#   script-src 'self'        Vite emits one module file; nothing is inline.
#   style-src  'unsafe-inline'  React writes `style={{...}}` as inline attributes. Unavoidable
#                            without rewriting them; low risk, since script injection is what
#                            CSP is really defending and that stays locked to 'self'.
#   img-src    blob:/data:   the camera draws frames to a canvas and reads them back.
#   connect-src 'self'       the page can talk to this API and nowhere else. If this ever
#                            starts reporting to somebody, the browser refuses it.
#   frame-ancestors 'none'   nobody may frame this — clickjacking a delete button otherwise
#                            costs somebody their collection.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

# The camera is the one capability this needs. Everything else a browser could hand a page —
# location above all — is refused outright, so a compromised script cannot ask for it.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), interest-cohort=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# No referrer, ever. A URL here contains a SKU, and a SKU is a fact about somebody's
# collection; it has no business travelling to another site.
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Deliberately no HSTS. The certificate here is self-signed by default, and HSTS on a
# self-signed host turns "click through the warning once" into "this address is now
# unreachable in this browser" with no way back that a normal person would find. A deployment
# behind a real certificate should add it; docs/SECURITY.md says so.

location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# Docker's embedded DNS, re-checked every 10s. Without a resolver nginx looks up `api` once
# at startup and caches the address forever, so recreating the api container leaves the whole
# UI serving 502s until nginx itself is restarted — silently, and only for the proxied paths.
resolver 127.0.0.11 valid=10s ipv6=off;

location /api/ {
    # The upstream must go through a variable, or nginx resolves it at startup regardless of
    # the resolver directive above. A variable also stops nginx rewriting the URI, so no path
    # is appended here — the API already serves under /api/ and the original URI passes
    # through unchanged.
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
}

location /health {
    set $api_health http://api:8000;
    proxy_pass $api_health;
    proxy_set_header Host $host;
}

# Vite fingerprints these filenames, so a given URL's contents can never change: a new build
# produces new names. Caching them for a year means a reload costs one small HTML document
# instead of the whole bundle.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# The entry point, and the only file whose name does not change between builds. It must be
# revalidated every time: it is what points at the fingerprinted bundle, so a cached copy
# pins the whole application to the version it shipped with. A user "on the latest release"
# running last month's code, with no way to tell, is the worst shape this bug takes.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
